name: Member Pipeline Health Check

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_test_alert:
        description: "1 でアラート経路(issue+メール)を合成失敗で検証"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROXY_URL: https://minami-baseball-ob.vercel.app/api/gas-proxy/dispatch
      OWNER: yasumorishima
      PROBE_REPO: minami-public-cron
      # Threshold for GAS heartbeat freshness (seconds). cron is hourly so allow up to 2h tolerance.
      GAS_HEARTBEAT_MAX_AGE_SEC: 7800
    steps:
      - name: Checkout (health check scripts)
        uses: actions/checkout@v4

      - name: Probe Vercel proxy with health-check dispatch
        env:
          GAS_WEBHOOK_SECRET: ${{ secrets.GAS_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # 後続の ack 確認が「この probe より後の ack か」を見るための基準時刻。
          echo "PROBE_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          # 2026-08-17: GitHub の repository_dispatch API が一過性の 503 を返し、proxy が 502 を
          # 返しただけで赤くなった (run 32050928879)。同時刻の funnies 側は成功しており全体障害
          # ではない。1 回目で hard fail せず 3 回まで引き直す。本物の故障 (secret drift / proxy
          # ダウン) は 3 回とも落ちるので検知感度は変わらない (最悪 +30 秒)。
          BODY="${RUNNER_TEMP:-.}/probe-body"
          attempt=0
          http=""
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            : > "$BODY"
            payload=$(jq -nc \
              --arg secret "$GAS_WEBHOOK_SECRET" \
              --arg ts "$(date -u +%FT%TZ)" \
              '{secret:$secret, event_type:"health-check", client_payload:{source:"public-cron-health-check", at:$ts}}')
            http=$(echo "$payload" | curl --max-time 20 -sS -o "$BODY" -w "%{http_code}" \
              -X POST "$VERCEL_PROXY_URL" \
              -H "Content-Type: application/json" \
              --data @-) || http="000"
            echo "attempt=$attempt vercel_proxy_http=$http"
            head -c 500 "$BODY" || true
            echo ""
            if [ "$http" = "200" ]; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::Vercel proxy probe succeeded on attempt $attempt (an earlier attempt failed with a transient upstream error)."
              fi
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$http" != "200" ]; then
            echo "::error::Vercel proxy returned HTTP $http on 3 attempts (expected 200). Pipeline likely broken: GAS_WEBHOOK_SECRET mismatch, App token, or proxy down."
            exit 1
          fi

      - name: Wait for dispatch to land
        run: sleep 45

      - name: Verify health-check-ack workflow ran after this probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ack を探す Actions の runs 一覧 API は古いキャッシュページを返すことがある。
          # 2026-08-19 の minami の 3 連続赤 (07:46 / 13:50 / 15:38 UTC) では dispatch の 3 秒後に
          # ack が success していたのに、同じ job 内の 3 回の取得が 07-08 -> 07-22 -> 07-11 と
          # 毎回別の古い run を「最新」と返した = 「間を空けて引き直す」だけでは効かない
          # (引き直すたびに別の stale shard を引くだけ)。照会自体は 2 エンドポイント併用の
          # scripts/newest-ack-created-at.sh に任せ、ここでは取得結果を捨てずに合算して
          # 「これまでに見えた中で最新」を採る。さらに dispatch を投げた時刻 (PROBE_START_EPOCH)
          # 以降の ack が見えたら即 OK とする。chain が本当に切れていればどの経路でも新しい ack は
          # 出てこないので検知感度は落ちない (遅延は最悪 +90 秒)。
          best_epoch=0
          best_at=""
          fresh_after=0
          if [ "${PROBE_START_EPOCH:-0}" -gt 0 ]; then
            fresh_after=$((PROBE_START_EPOCH - 60))
          fi
          for attempt in 1 2 3 4; do
            seen=$(scripts/newest-ack-created-at.sh "$OWNER" "$PROBE_REPO" health-check)
            if [ -n "$seen" ]; then
              epoch=$(date -u -d "$seen" +%s)
              if [ "$epoch" -gt "$best_epoch" ]; then
                best_epoch=$epoch
                best_at=$seen
              fi
            fi
            if [ "$best_epoch" -gt 0 ]; then
              age_sec=$(( $(date -u +%s) - best_epoch ))
              echo "attempt=$attempt newest_ack_seen=$best_at age_sec=$age_sec fresh_after=$fresh_after"
              if [ "$fresh_after" -gt 0 ] && [ "$best_epoch" -ge "$fresh_after" ]; then
                exit 0
              fi
              if [ "$age_sec" -le 600 ]; then
                exit 0
              fi
            else
              echo "attempt=$attempt no health-check ack run in listing"
            fi
            if [ "$attempt" -lt 4 ]; then sleep 30; fi
          done
          if [ "$best_epoch" -eq 0 ]; then
            echo "::error::No health-check-ack run found at all in 4 consecutive checks across 2 endpoints (workflow not installed?)."
            exit 1
          fi
          echo "::error::Newest health-check-ack seen is $best_at ($(( $(date -u +%s) - best_epoch ))s ago) after 4 checks across 2 endpoints. dispatch chain likely broken."
          exit 1

      - name: Verify GAS heartbeat freshness (gas-heartbeat-ack)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ack 確認と同じ stale read を踏むので、同じ照会 (2 エンドポイント併用) を 3 回合算して
          # 最新値を採る。閾値は 2 時間強なので、古い page を掴んだ 1 回で赤にしない。
          best_epoch=0
          best_at=""
          for attempt in 1 2 3; do
            seen=$(scripts/newest-ack-created-at.sh "$OWNER" "$PROBE_REPO" gas-heartbeat)
            if [ -n "$seen" ]; then
              epoch=$(date -u -d "$seen" +%s)
              if [ "$epoch" -gt "$best_epoch" ]; then
                best_epoch=$epoch
                best_at=$seen
              fi
            fi
            if [ "$best_epoch" -gt 0 ]; then
              age_sec=$(( $(date -u +%s) - best_epoch ))
              echo "attempt=$attempt latest_gas_heartbeat=$best_at age_sec=$age_sec threshold=$GAS_HEARTBEAT_MAX_AGE_SEC"
              if [ "$age_sec" -le "$GAS_HEARTBEAT_MAX_AGE_SEC" ]; then
                exit 0
              fi
            else
              echo "attempt=$attempt no gas-heartbeat run in listing"
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          if [ "$best_epoch" -eq 0 ]; then
            echo "::warning::No gas-heartbeat run ever seen yet (GAS trigger may not be installed). Skipping freshness check."
            exit 0
          fi
          echo "::error::GAS heartbeat is $(( $(date -u +%s) - best_epoch ))s old (>${GAS_HEARTBEAT_MAX_AGE_SEC}s, newest seen $best_at). GAS time trigger may be silently dead (OAuth scope failure pattern)."
          exit 1

      - name: Probe gas-issue-form (feedback Gmail path) secret match
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_WEBHOOK_SECRET: ${{ secrets.GAS_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail
          # Send approval-notify with missing `to` field. Expected response: "to required"
          # (secret matched, missing param). "unauthorized" body = secret mismatch.
          payload=$(jq -nc --arg secret "$GAS_WEBHOOK_SECRET" '{secret:$secret, action:"approval-notify"}')
          # gas-issue-form は deprecated な Google ホストの Web App で、単発の接続 transient
          # (curl timeout / 5xx / 一時的 404) が起きる。これは admin に対処不能なので、内側 GAS
          # probe と同様「一過性は無音、本物 (secret 不一致) だけ通知」にする。
          # GAS Web Apps return 302 to a googleusercontent.com URL serving the stored response over GET.
          # curl default (no -X POST): POST initial, auto-convert to GET on 302 redirect. 最大 3 回リトライ。
          http="000"; body=""
          for attempt in 1 2 3; do
            http=$(echo "$payload" | curl --max-time 25 -sS -L -o /tmp/issueform-body -w "%{http_code}" \
              "$GAS_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data-binary @-) || http="000"
            body=$(head -c 500 /tmp/issueform-body 2>/dev/null || true)
            echo "issueform attempt=$attempt http=$http body=$body"
            # 成功 (secret 一致) か authoritative な secret 不一致が出たら確定、リトライ打ち切り。
            if [ "$http" = "200" ] && echo "$body" | grep -q "to required"; then break; fi
            if echo "$body" | grep -q "unauthorized"; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          # 本物の障害: secret ドリフト (admin が対処すべき) → hard fail + メール。
          if echo "$body" | grep -q "unauthorized"; then
            echo "::error::gas-issue-form returned unauthorized — WEBHOOK_SECRET drifted from Vercel FEEDBACK_GAS_SECRET. /feedback creates GitHub issue but Gmail notification silently dropped."
            exit 1
          fi
          # 正常: secret 一致・想定どおり param 欠落。
          if [ "$http" = "200" ] && echo "$body" | grep -q "to required"; then
            echo "gas-issue-form OK (secret matched)"
            exit 0
          fi
          # それ以外 (timeout / 接続失敗 / 非200 / 想定外 body) は deprecated webapp の Google 側
          # 一過性とみなし warning のみ (ジョブを落とさない = メール抑制)。secret 不一致は上で hard fail 済。
          echo "::warning::gas-issue-form probe non-authoritative after 3 attempts (http=$http body=$body) — likely transient Google-side unavailability on the deprecated Web App; not failing the job."

      - name: Mint App token for failure alerting
        if: ${{ !cancelled() }}
        id: alert-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.OWNER }}
          repositories: minami-baseball-ob

      - name: Detect member-pipeline workflow failures and alert
        if: ${{ !cancelled() }}
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.alert-app.outputs.token }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_WEBHOOK_SECRET: ${{ secrets.GAS_WEBHOOK_SECRET }}
          HEALTHCHECK_FORCE_TEST: ${{ github.event.inputs.force_test_alert }}
        run: python3 scripts/check-pipeline-health.py
