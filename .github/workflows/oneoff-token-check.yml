name: One-off token check (read-only)

# 一度だけの確認用。読み取りの SQL だけを流す。作業ブランチへの push でだけ動く。終わったら消す。
on:
  push:
    branches: [ccr-5cecb90d-m2xvbx]
    paths: [.github/workflows/oneoff-token-check.yml]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Management API で読み取りの SQL
        run: |
          set -euo pipefail
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          q="select (select json_agg(json_build_object('t',tgname,'e',tgenabled)) from pg_trigger where tgname like '%lock_uploaded_by') as triggers,
            (select prosrc like '%pg_trigger_depth()%' from pg_proc where proname='lock_uploaded_by') as fixed_fn,
            (select count(*) from public.photos p where uploaded_by is not null and not exists (select 1 from auth.users u where u.id=p.uploaded_by)) as dangling_photos,
            (select count(*) from public.videos v where uploaded_by is not null and not exists (select 1 from auth.users u where u.id=v.uploaded_by)) as dangling_videos"
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -n --arg q "$q" '{query:$q}')")
          echo "HTTP $code"; jq -c . out.json
          [ "$code" = 201 ] || [ "$code" = 200 ]
